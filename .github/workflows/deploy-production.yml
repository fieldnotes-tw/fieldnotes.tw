name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Keep separate from AWS_REGION — configure-aws-credentials overwrites AWS_REGION.
  DEPLOY_REGION: ap-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          # Assume via a long-lived STS region; resource calls use DEPLOY_REGION.
          aws-region: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets into server/public
        run: |
          npm ci
          npm --prefix server ci
          npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/production
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_BACKEND_BUCKET}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "ecr=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "instance=$(terraform output -raw api_instance_id)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          ECR_REPO: ${{ steps.tf.outputs.ecr }}
        run: |
          REGISTRY="${ECR_REPO%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE_TAG="${GITHUB_SHA}"
          mkdir -p server/locales server/public/locales
          cp public/locales/*.json server/locales/
          cp public/locales/*.json server/public/locales/
          # t4g.* API hosts are arm64
          docker buildx build --platform linux/arm64 --push \
            -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:latest" server

      - name: Deploy API via SSM
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          INSTANCE_ID: ${{ steps.tf.outputs.instance }}
        run: |
          B64=$(base64 -w0 <<EOF
          #!/bin/bash
          set -euo pipefail
          cat >/etc/nginx/conf.d/api.conf <<'NGINX'
          server {
            listen 80 default_server;
            client_max_body_size 20m;
            location / {
              proxy_pass http://127.0.0.1:3001;
              proxy_http_version 1.1;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
              proxy_set_header Cookie \$http_cookie;
              proxy_set_header Accept-Language \$http_accept_language;
            }
          }
          NGINX
          nginx -t && systemctl reload nginx
          /usr/local/bin/fieldnotes-deploy.sh ${GITHUB_SHA}
          EOF
          )
          PARAMS=$(jq -n --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Invalidate CloudFront
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*"
