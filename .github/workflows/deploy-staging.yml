name: Deploy staging

on:
  push:
    branches: [development]
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      action:
        description: deploy creates/updates staging; destroy tears it down to save money
        type: choice
        options:
          - deploy
          - destroy
        default: deploy
      confirm:
        description: For destroy, type destroy-staging exactly
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

# One staging environment — don't let push + PR deploys fight each other.
concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  # Keep separate from AWS_REGION — configure-aws-credentials overwrites AWS_REGION.
  DEPLOY_REGION: ap-east-2
  # Pushes always deploy; manual runs use the chosen action.
  ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }}

jobs:
  deploy:
    # Native arm64 — matches t4g.* API hosts (no QEMU cross-build).
    runs-on: ubuntu-24.04-arm
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          # Assume via a long-lived STS region; resource calls use DEPLOY_REGION.
          aws-region: us-east-1

      - name: Require confirm for destroy
        if: env.ACTION == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != 'destroy-staging' ]; then
            echo "Destroy refused: set confirm to destroy-staging" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: env.ACTION == 'deploy'
        with:
          node-version: '22'
          cache: npm

      - name: Build assets into server/public
        if: env.ACTION == 'deploy'
        run: |
          npm ci
          npm --prefix server ci
          npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        id: tf
        if: env.ACTION == 'deploy'
        working-directory: infra/staging
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          # Set GitHub Environment variable USE_CUSTOM_DOMAIN=true after ACM is issued.
          TF_VAR_use_custom_domain: ${{ vars.USE_CUSTOM_DOMAIN || 'false' }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_BACKEND_BUCKET}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -auto-approve -input=false
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "ecr=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "instance=$(terraform output -raw api_instance_id)" >> "$GITHUB_OUTPUT"

      - name: Terraform destroy
        if: env.ACTION == 'destroy'
        working-directory: infra/staging
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_use_custom_domain: ${{ vars.USE_CUSTOM_DOMAIN || 'false' }}
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF
          bucket = "${TF_BACKEND_BUCKET}"
          EOF
          terraform init -input=false -backend-config=backend.hcl

          # Versioned buckets block DeleteBucket unless emptied (or force_destroy is
          # already true in state). Empty everything still tracked in state first,
          # including leftover frontend buckets removed from config but not yet gone.
          empty_bucket() {
            local bucket="$1"
            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "Bucket $bucket already gone"
              return 0
            fi
            echo "Emptying s3://$bucket"
            while true; do
              local versions payload count
              versions=$(aws s3api list-object-versions --bucket "$bucket" --max-keys 1000 --output json)
              payload=$(echo "$versions" | jq '{
                Objects: ([.Versions[]?, .DeleteMarkers[]?] | map({Key: .Key, VersionId: .VersionId})),
                Quiet: true
              }')
              count=$(echo "$payload" | jq '.Objects | length')
              if [ "$count" -eq 0 ]; then
                break
              fi
              aws s3api delete-objects --bucket "$bucket" --delete "$payload" >/dev/null
            done
          }

          while IFS= read -r bucket; do
            [ -z "$bucket" ] && continue
            empty_bucket "$bucket"
          done < <(terraform state pull | jq -r '
            .resources[]?
            | select(.type == "aws_s3_bucket")
            | .instances[]?.attributes.bucket
            | select(. != null)
          ' | sort -u)

          terraform destroy -auto-approve -input=false

      - name: Wait for API host (SSM)
        if: env.ACTION == 'deploy'
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          INSTANCE_ID: ${{ steps.tf.outputs.instance }}
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo None)
            echo "ssm ping=$STATUS (attempt $i)"
            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "API instance ${INSTANCE_ID} never came online in SSM" >&2
          exit 1

      - name: Build and push API image
        if: env.ACTION == 'deploy'
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          ECR_REPO: ${{ steps.tf.outputs.ecr }}
        run: |
          REGISTRY="${ECR_REPO%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE_TAG="${GITHUB_SHA}"
          docker build \
            -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:latest" server
          docker push "$ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REPO:latest"

      - name: Deploy API via SSM
        if: env.ACTION == 'deploy'
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
          INSTANCE_ID: ${{ steps.tf.outputs.instance }}
        run: |
          B64=$(base64 -w0 <<EOF
          #!/bin/bash
          set -euo pipefail
          /usr/local/bin/fieldnotes-deploy.sh ${GITHUB_SHA}
          EOF
          )
          PARAMS=$(jq -n --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Invalidate CloudFront
        if: env.ACTION == 'deploy'
        env:
          AWS_REGION: ${{ env.DEPLOY_REGION }}
          AWS_DEFAULT_REGION: ${{ env.DEPLOY_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*"
