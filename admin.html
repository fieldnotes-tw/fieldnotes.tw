<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>管理後台 · 最近左營</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) {
      document.documentElement.classList.add('is-blink');
    }
  </script>
</head>
<body>

<header class="auth-page-head">
  <a href="index.html" class="brand-mark" aria-label="最近左營"><span>最</span><span>近</span><span>左</span><span>營</span></a>
  <div class="auth-nav" data-auth-nav></div>
</header>

<main class="admin-main">
  <div class="admin-head">
    <h1 class="admin-head__title">管理後台</h1>
    <p class="admin-head__sub">管理現象卡片、圖片與使用者。</p>
  </div>

  <section class="admin-panel">
    <div class="admin-panel__bar">
      <div>
        <h2 class="admin-panel__title">現象內容</h2>
        <p class="admin-panel__meta" id="phenomenaMeta">載入中…</p>
      </div>
      <button type="button" class="admin-btn admin-btn--primary" id="btnNewPhenomenon">新增現象</button>
    </div>

    <div class="admin-filters" role="group" aria-label="狀態篩選">
      <button type="button" class="admin-filters__btn is-active" data-status="all">全部</button>
      <button type="button" class="admin-filters__btn" data-status="active">正在發生</button>
      <button type="button" class="admin-filters__btn" data-status="upcoming">即將到來</button>
      <button type="button" class="admin-filters__btn" data-status="ending">即將結束</button>
      <button type="button" class="admin-filters__btn" data-status="ended">已結束</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="phenomenaTable">
        <thead>
          <tr>
            <th>圖</th>
            <th>標題</th>
            <th>分類</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel" id="phenomenonEditor" hidden>
    <h2 class="admin-panel__title" id="phenomenonEditorTitle">新增現象</h2>
    <form class="admin-form" id="phenomenonForm">
      <label class="admin-form__field">
        <span>標題</span>
        <input id="f_title" required maxlength="200">
      </label>
      <label class="admin-form__field">
        <span>描述</span>
        <textarea id="f_description" required maxlength="2000" rows="4"></textarea>
      </label>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span>分類</span>
          <select id="f_category">
            <option value="plant">植物</option>
            <option value="animal">動物</option>
            <option value="sky">天文地景</option>
            <option value="taste">當季滋味</option>
            <option value="workshop">工作坊</option>
          </select>
        </label>
        <label class="admin-form__field">
          <span>狀態</span>
          <select id="f_status">
            <option value="active">正在發生</option>
            <option value="upcoming">即將到來</option>
            <option value="ending">即將結束</option>
            <option value="ended">已結束</option>
          </select>
        </label>
      </div>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span>地點</span>
          <input id="f_location" maxlength="300">
        </label>
        <label class="admin-form__field">
          <span>觀察者</span>
          <input id="f_observerName" maxlength="100">
        </label>
      </div>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span>緯度</span>
          <input id="f_lat" type="number" step="any" min="-90" max="90">
        </label>
        <label class="admin-form__field">
          <span>經度</span>
          <input id="f_lng" type="number" step="any" min="-180" max="180">
        </label>
      </div>
      <label class="admin-form__field">
        <span>備註</span>
        <textarea id="f_notes" maxlength="2000" rows="3"></textarea>
      </label>
      <label class="admin-form__field">
        <span>時間標籤</span>
        <input id="f_metaLabel" maxlength="200" placeholder="例如：最近一次注意到 · 1 天前">
      </label>

      <div class="admin-upload">
        <label class="admin-form__field">
          <span>圖片</span>
          <input id="f_image" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
        <img id="imagePreview" class="admin-upload__preview" alt="" hidden>
        <p class="admin-upload__path" id="imagePath">尚未上傳</p>
        <label class="admin-form__field">
          <span>圖片說明</span>
          <input id="f_imageAlt" maxlength="500">
        </label>
      </div>

      <p class="auth-form__error" id="phenomenonError" hidden></p>
      <div class="admin-form__actions">
        <button type="button" class="admin-btn" id="btnCancelEditor">取消</button>
        <button type="submit" class="admin-btn admin-btn--primary">儲存</button>
      </div>
    </form>
  </section>

  <section class="admin-panel">
    <h2 class="admin-panel__title">使用者</h2>
    <p class="admin-panel__meta" id="adminUserMeta">載入中…</p>
    <div class="admin-table-wrap">
      <table class="admin-table" id="adminUsersTable">
        <thead>
          <tr>
            <th>電子郵件</th>
            <th>角色</th>
            <th>已確認</th>
            <th>建立時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel admin-panel--muted">
    <h2 class="admin-panel__title">投稿審核</h2>
    <p class="admin-panel__meta">之後在這裡處理觀察員投稿。</p>
  </section>
</main>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
