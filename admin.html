<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>管理後台 · 最近左營</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) {
      document.documentElement.classList.add('is-blink');
    }
  </script>
</head>
<body>

<header class="auth-page-head">
  <a href="index.html" class="brand-mark" aria-label="最近左營"><span>最</span><span>近</span><span>左</span><span>營</span></a>
  <div class="auth-nav" data-auth-nav></div>
</header>

<main class="admin-main">
  <div class="admin-head">
    <h1 class="admin-head__title">管理後台</h1>
    <p class="admin-head__sub">基本架構先就位，功能之後再補。</p>
  </div>

  <section class="admin-panel">
    <h2 class="admin-panel__title">使用者</h2>
    <p class="admin-panel__meta" id="adminUserMeta">載入中…</p>
    <div class="admin-table-wrap">
      <table class="admin-table" id="adminUsersTable">
        <thead>
          <tr>
            <th>用戶名</th>
            <th>角色</th>
            <th>建立時間</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel admin-panel--muted">
    <h2 class="admin-panel__title">現象內容</h2>
    <p class="admin-panel__meta">之後在這裡編輯、上下架現象卡片。</p>
  </section>

  <section class="admin-panel admin-panel--muted">
    <h2 class="admin-panel__title">投稿審核</h2>
    <p class="admin-panel__meta">之後在這裡處理觀察員投稿。</p>
  </section>
</main>

<script src="auth.js"></script>
<script>
  const metaEl = document.getElementById('adminUserMeta');
  const tbody = document.querySelector('#adminUsersTable tbody');

  function formatWhen(value) {
    if (!value) return '—';
    try {
      return new Intl.DateTimeFormat('zh-TW', {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(new Date(value));
    } catch {
      return value;
    }
  }

  async function loadAdmin() {
    let user;
    try {
      user = await refreshCurrentUser();
    } catch {
      location.href = 'login.html';
      return;
    }

    if (!user) {
      location.href = 'login.html';
      return;
    }
    if (user.role !== 'admin') {
      location.href = 'index.html';
      return;
    }

    document.querySelectorAll('[data-auth-nav]').forEach(renderAuthNav);

    try {
      const { data } = await api('/api/admin/users');
      metaEl.textContent = `共 ${data.length} 位使用者`;
      tbody.replaceChildren(...data.map((row) => {
        const tr = document.createElement('tr');
        const roleLabel = row.role === 'admin' ? '管理員' : '一般使用者';
        tr.innerHTML = `<td></td><td></td><td></td>`;
        tr.children[0].textContent = row.username;
        tr.children[1].textContent = roleLabel;
        tr.children[2].textContent = formatWhen(row.createdAt);
        return tr;
      }));
    } catch (err) {
      metaEl.textContent = err.message || '無法載入使用者列表';
    }
  }

  loadAdmin();
</script>
</body>
</html>
