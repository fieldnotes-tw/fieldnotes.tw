<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title data-i18n-title="admin.pageTitle">管理後台 · 最近左營</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) {
      document.documentElement.classList.add('is-blink');
    }
  </script>
</head>
<body>

<header class="auth-page-head">
  <a href="index.html" class="brand-mark" data-i18n-aria-label="brand.name" aria-label="最近左營"><span>最</span><span>近</span><span>左</span><span>營</span></a>
  <div class="auth-nav" data-auth-nav></div>
</header>

<main class="admin-main">
  <div class="admin-head">
    <h1 class="admin-head__title" data-i18n="admin.title">管理後台</h1>
    <p class="admin-head__sub" data-i18n="admin.subtitle">管理現象卡片、圖片與使用者。</p>
  </div>

  <section class="admin-panel">
    <div class="admin-panel__bar">
      <div>
        <h2 class="admin-panel__title" data-i18n="admin.phenomena.title">現象內容</h2>
        <p class="admin-panel__meta" id="phenomenaMeta" data-i18n="admin.phenomena.loading">載入中…</p>
      </div>
      <button type="button" class="admin-btn admin-btn--primary" id="btnNewPhenomenon" data-i18n="admin.phenomena.new">新增現象</button>
    </div>

    <div class="admin-filters" role="group" data-i18n-aria-label="admin.filters.status" aria-label="狀態篩選">
      <button type="button" class="admin-filters__btn is-active" data-status="all" data-i18n="status.all">全部</button>
      <button type="button" class="admin-filters__btn" data-status="active" data-i18n="status.active">正在發生</button>
      <button type="button" class="admin-filters__btn" data-status="upcoming" data-i18n="status.upcoming">即將到來</button>
      <button type="button" class="admin-filters__btn" data-status="ending" data-i18n="status.ending">即將結束</button>
      <button type="button" class="admin-filters__btn" data-status="ended" data-i18n="status.ended">已結束</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="phenomenaTable">
        <thead>
          <tr>
            <th data-i18n="admin.table.image">圖</th>
            <th data-i18n="admin.table.title">標題</th>
            <th data-i18n="admin.table.category">分類</th>
            <th data-i18n="admin.table.status">狀態</th>
            <th data-i18n="admin.table.actions">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel" id="phenomenonEditor" hidden>
    <h2 class="admin-panel__title" id="phenomenonEditorTitle" data-i18n="admin.phenomena.new">新增現象</h2>
    <form class="admin-form" id="phenomenonForm">
      <label class="admin-form__field">
        <span data-i18n="admin.form.title">標題</span>
        <input id="f_title" required maxlength="200">
      </label>
      <label class="admin-form__field">
        <span data-i18n="admin.form.description">描述</span>
        <textarea id="f_description" required maxlength="2000" rows="4"></textarea>
      </label>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span data-i18n="admin.form.category">分類</span>
          <select id="f_category">
            <option value="plant" data-i18n="category.plant">植物</option>
            <option value="animal" data-i18n="category.animal">動物</option>
            <option value="sky" data-i18n="category.sky">天文地景</option>
            <option value="taste" data-i18n="category.taste">當季滋味</option>
            <option value="workshop" data-i18n="category.workshop">工作坊</option>
          </select>
        </label>
        <label class="admin-form__field">
          <span data-i18n="admin.form.status">狀態</span>
          <select id="f_status">
            <option value="active" data-i18n="status.active">正在發生</option>
            <option value="upcoming" data-i18n="status.upcoming">即將到來</option>
            <option value="ending" data-i18n="status.ending">即將結束</option>
            <option value="ended" data-i18n="status.ended">已結束</option>
          </select>
        </label>
      </div>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span data-i18n="admin.form.location">地點</span>
          <input id="f_location" maxlength="300">
        </label>
        <label class="admin-form__field">
          <span data-i18n="admin.form.observer">觀察者</span>
          <input id="f_observerName" maxlength="100">
        </label>
      </div>
      <div class="admin-form__row">
        <label class="admin-form__field">
          <span data-i18n="admin.form.lat">緯度</span>
          <input id="f_lat" type="number" step="any" min="-90" max="90">
        </label>
        <label class="admin-form__field">
          <span data-i18n="admin.form.lng">經度</span>
          <input id="f_lng" type="number" step="any" min="-180" max="180">
        </label>
      </div>
      <label class="admin-form__field">
        <span data-i18n="admin.form.notes">備註</span>
        <textarea id="f_notes" maxlength="2000" rows="3"></textarea>
      </label>
      <label class="admin-form__field">
        <span data-i18n="admin.form.metaLabel">時間標籤</span>
        <input id="f_metaLabel" maxlength="200" data-i18n-placeholder="admin.form.metaPlaceholder" placeholder="例如：最近一次注意到 · 1 天前">
      </label>

      <div class="admin-upload">
        <label class="admin-form__field">
          <span data-i18n="admin.form.image">圖片</span>
          <input id="f_image" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
        <img id="imagePreview" class="admin-upload__preview" alt="" hidden>
        <p class="admin-upload__path" id="imagePath" data-i18n="admin.form.imageNone">尚未上傳</p>
        <label class="admin-form__field">
          <span data-i18n="admin.form.imageAlt">圖片說明</span>
          <input id="f_imageAlt" maxlength="500">
        </label>
      </div>

      <p class="auth-form__error" id="phenomenonError" hidden></p>
      <div class="admin-form__actions">
        <button type="button" class="admin-btn" id="btnCancelEditor" data-i18n="admin.form.cancel">取消</button>
        <button type="submit" class="admin-btn admin-btn--primary" data-i18n="admin.form.save">儲存</button>
      </div>
    </form>
  </section>

  <section class="admin-panel">
    <h2 class="admin-panel__title" data-i18n="admin.users.title">使用者</h2>
    <p class="admin-panel__meta" id="adminUserMeta" data-i18n="admin.users.loading">載入中…</p>
    <div class="admin-table-wrap">
      <table class="admin-table" id="adminUsersTable">
        <thead>
          <tr>
            <th data-i18n="admin.users.email">電子郵件</th>
            <th data-i18n="admin.users.role">角色</th>
            <th data-i18n="admin.users.verified">已確認</th>
            <th data-i18n="admin.users.created">建立時間</th>
            <th data-i18n="admin.users.actions">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel admin-panel--muted">
    <h2 class="admin-panel__title" data-i18n="admin.moderation.title">投稿審核</h2>
    <p class="admin-panel__meta" data-i18n="admin.moderation.meta">之後在這裡處理觀察員投稿。</p>
  </section>
</main>

<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
