<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title data-i18n-title="auth.register.pageTitle">註冊帳號 · 最近左營</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) {
      document.documentElement.classList.add('is-blink');
    }
  </script>
</head>
<body>

<header class="auth-page-head">
  <a href="index.html" class="brand-mark" data-i18n-aria-label="brand.name" aria-label="最近左營"><span>最</span><span>近</span><span>左</span><span>營</span></a>
  <div class="auth-nav" data-auth-nav></div>
</header>

<main class="auth-main">
  <form class="auth-form" id="registerForm" novalidate>
    <h1 class="auth-form__title" data-i18n="auth.register.title">註冊帳號</h1>
    <label class="auth-form__field">
      <span data-i18n="auth.field.email">電子郵件</span>
      <input type="email" name="email" autocomplete="email" required maxlength="254">
    </label>
    <label class="auth-form__field">
      <span data-i18n="auth.field.password">密碼</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label class="auth-form__field">
      <span data-i18n="auth.register.confirmPassword">確認密碼</span>
      <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8">
    </label>
    <p class="auth-form__error" id="registerError" hidden></p>
    <p class="auth-form__success" id="registerSuccess" hidden></p>
    <button type="submit" class="auth-form__submit" data-i18n="auth.register.submit">註冊</button>
    <button type="button" class="auth-form__secondary" id="resendBtn" hidden data-i18n="auth.register.resend">重送確認信</button>
    <div class="auth-form__divider"><span data-i18n="auth.register.or">或</span></div>
    <button type="button" class="auth-form__line-btn" id="lineRegisterBtn" disabled data-i18n="auth.register.line">用 LINE 登入（即將開放）</button>
    <p class="auth-form__switch"><span data-i18n="auth.register.switch">已經有帳號了嗎？</span><a href="login.html" data-i18n="auth.register.switchLink">登入</a></p>
  </form>
</main>

<script src="i18n.js"></script>
<script src="auth.js"></script>
<script>
  i18nReady.then(() => {
    refreshCurrentUser().then((user) => {
      if (user) location.href = 'index.html';
    }).catch(() => {});

    const form = document.getElementById('registerForm');
    const errorEl = document.getElementById('registerError');
    const successEl = document.getElementById('registerSuccess');
    const resendBtn = document.getElementById('resendBtn');
    let pendingEmail = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;
      if (password !== confirmPassword) {
        errorEl.textContent = t('auth.register.passwordMismatch');
        errorEl.hidden = false;
        successEl.hidden = true;
        return;
      }
      if (password.length < 8) {
        errorEl.textContent = t('auth.register.passwordTooShort');
        errorEl.hidden = false;
        successEl.hidden = true;
        return;
      }
      errorEl.hidden = true;
      successEl.hidden = true;
      try {
        const data = await register(email, password);
        pendingEmail = data.email;
        successEl.textContent = t('auth.register.sent', { email: data.email });
        successEl.hidden = false;
        resendBtn.hidden = false;
        form.password.value = '';
        form.confirmPassword.value = '';
      } catch (err) {
        errorEl.textContent = err.status === 409
          ? t('auth.register.alreadyRegistered')
          : (err.message || t('auth.register.failed'));
        errorEl.hidden = false;
      }
    });

    resendBtn.addEventListener('click', async () => {
      const email = pendingEmail || form.email.value.trim();
      if (!email) return;
      errorEl.hidden = true;
      try {
        await resendConfirmation(email);
        successEl.textContent = t('auth.register.resent', { email });
        successEl.hidden = false;
      } catch (err) {
        errorEl.textContent = err.message || t('auth.register.resendFailed');
        errorEl.hidden = false;
      }
    });
  });
</script>
</body>
</html>
