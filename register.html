<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>註冊帳號 · 最近左營</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) {
      document.documentElement.classList.add('is-blink');
    }
  </script>
</head>
<body>

<header class="auth-page-head">
  <a href="index.html" class="brand-mark" aria-label="最近左營"><span>最</span><span>近</span><span>左</span><span>營</span></a>
  <div class="auth-nav" data-auth-nav></div>
</header>

<main class="auth-main">
  <form class="auth-form" id="registerForm" novalidate>
    <h1 class="auth-form__title">註冊帳號</h1>
    <label class="auth-form__field">
      <span>電子郵件</span>
      <input type="email" name="email" autocomplete="email" required maxlength="254">
    </label>
    <label class="auth-form__field">
      <span>密碼</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label class="auth-form__field">
      <span>確認密碼</span>
      <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8">
    </label>
    <p class="auth-form__error" id="registerError" hidden></p>
    <p class="auth-form__success" id="registerSuccess" hidden></p>
    <button type="submit" class="auth-form__submit">註冊</button>
    <button type="button" class="auth-form__secondary" id="resendBtn" hidden>重送確認信</button>
    <div class="auth-form__divider"><span>或</span></div>
    <button type="button" class="auth-form__line-btn" id="lineRegisterBtn" disabled>用 LINE 登入（即將開放）</button>
    <p class="auth-form__switch">已經有帳號了嗎？<a href="login.html">登入</a></p>
  </form>
</main>

<script src="auth.js"></script>
<script>
  refreshCurrentUser().then((user) => {
    if (user) location.href = 'index.html';
  }).catch(() => {});

  const form = document.getElementById('registerForm');
  const errorEl = document.getElementById('registerError');
  const successEl = document.getElementById('registerSuccess');
  const resendBtn = document.getElementById('resendBtn');
  let pendingEmail = '';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    const password = form.password.value;
    const confirmPassword = form.confirmPassword.value;
    if (password !== confirmPassword) {
      errorEl.textContent = '密碼與確認密碼不一致';
      errorEl.hidden = false;
      successEl.hidden = true;
      return;
    }
    if (password.length < 8) {
      errorEl.textContent = '密碼至少需要 8 個字元';
      errorEl.hidden = false;
      successEl.hidden = true;
      return;
    }
    errorEl.hidden = true;
    successEl.hidden = true;
    try {
      const data = await register(email, password);
      pendingEmail = data.email;
      successEl.textContent = `已寄出確認信到 ${data.email}，請至信箱完成確認後再登入。`;
      successEl.hidden = false;
      resendBtn.hidden = false;
      form.password.value = '';
      form.confirmPassword.value = '';
    } catch (err) {
      errorEl.textContent = err.status === 409
        ? '這個電子郵件已被註冊'
        : (err.message || '註冊失敗');
      errorEl.hidden = false;
    }
  });

  resendBtn.addEventListener('click', async () => {
    const email = pendingEmail || form.email.value.trim();
    if (!email) return;
    errorEl.hidden = true;
    try {
      await resendConfirmation(email);
      successEl.textContent = `已重新寄出確認信到 ${email}。`;
      successEl.hidden = false;
    } catch (err) {
      errorEl.textContent = err.message || '無法重送確認信';
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
